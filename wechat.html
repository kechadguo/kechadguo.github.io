<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <!-- 内容安全策略：限制资源来源，纵深防御 XSS（防第三方脚本/外联数据窃取） -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'">
  <title>成长日记</title>
  <!-- ============================================================
       双通道渐进发布（规格书 §1.1）：与网页版同一判定逻辑。
       v1 = 纯内联样式（与 V74 一致，0 个 v2 请求）；
       v2 = 追加 tokens + styles-v2 + theme-v2（共享 V2 设计语言）。
       ============================================================ -->
  <script>
  (function(){
    var m = location.search.match(/[?&]ui=(v1|v2)/);
    if (m) { try { localStorage.setItem('uiVersion', m[1]); } catch(e){} }
    var v = 'v1';
    try {
      // P5 · 云端应急回退通道：与网页版同一判定逻辑，forceRollback==='1' 强制 V1（优先级最高）
      if (localStorage.getItem('forceRollback') !== '1') {
        v = localStorage.getItem('uiVersion') || 'v1';
      }
    } catch(e){}
    window.__UI_V2__ = (v === 'v2');
  })();
  </script>
  <style>
    /* ============ 微信端样式 ============ */
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
      font-size:16px;color:var(--color-text-primary,#333);background:var(--color-bg-sunken,#F5F5F5);
      -webkit-tap-highlight-color:transparent;
      -webkit-font-smoothing:antialiased;
    }

    /* 顶部 */
    .wx-topbar{
      position:fixed;top:0;left:0;right:0;z-index:100;
      height:48px;background:#07C160;color:#fff;
      display:flex;align-items:center;justify-content:space-between;
      padding:0 16px;
    }
    .wx-title{font-size:16px;font-weight:600}
    .wx-icon-btn{background:none;border:none;color:#fff;font-size:20px;padding:4px 8px;cursor:pointer}

    /* 摘要条 */
    .wx-summary-bar{
      position:fixed;top:48px;left:0;right:0;z-index:99;
      background:var(--color-bg-raised,#fff);padding:10px 16px;
      display:flex;justify-content:space-around;
      border-bottom:1px solid var(--color-border-subtle,#eee);font-size:14px;
    }
    .wx-summary-bar b{color:#07C160;font-size:18px;margin:0 2px}

    /* 主区域 */
    .wx-main-area{
      margin-top:92px;margin-bottom:56px;min-height:calc(100vh - 148px);
      padding:16px;
    }

    /* 底部导航 */
    .wx-tabbar{
      position:fixed;bottom:0;left:0;right:0;z-index:100;
      height:56px;background:var(--color-bg-raised,#fff);display:flex;
      border-top:1px solid var(--color-border-subtle,#eee);
    }
    .wx-tab-btn{
      flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
      background:none;border:none;color:var(--color-text-secondary,#999);font-size:10px;cursor:pointer;gap:2px;
    }
    .wx-tab-btn.active{color:#07C160}
    .wx-tab-icon{font-size:22px}

    /* 大语音按钮 */
    .wx-quick-area{padding-top:16px}
    .wx-big-mic-wrap{text-align:center;margin-bottom:24px}
    .wx-big-mic{
      width:88px;height:88px;border-radius:50%;
      background:linear-gradient(135deg,#07C160,#06AD56);
      color:#fff;border:none;font-size:40px;cursor:pointer;
      box-shadow:0 4px 20px rgba(7,193,96,0.3);
      display:flex;align-items:center;justify-content:center;
      margin:0 auto;transition:transform 0.15s;
    }
    .wx-big-mic:active{transform:scale(0.9)}
    .wx-mic-icon{line-height:1}
    .wx-mic-hint{font-size:16px;font-weight:500;color:var(--color-text-primary,#333);margin-top:12px}
    .wx-mic-example{font-size:13px;color:var(--color-text-secondary,#999);margin-top:4px}

    /* 语音结果 */
    .wx-voice-result{
      background:var(--color-bg-raised,#fff);border-radius:12px;padding:20px;margin-bottom:20px;text-align:center;
      box-shadow:0 2px 8px rgba(0,0,0,0.06);
    }
    .wx-voice-text{margin-bottom:16px}
    .wx-parse-text{font-size:16px;color:var(--color-text-primary,#333);margin-bottom:12px;line-height:1.5}
    .wx-parse-fields{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:8px}
    .wx-field-tag{
      background:var(--color-success-soft,#E8F5E9);color:var(--color-success-deep,#2E7D32);padding:6px 14px;border-radius:16px;
      font-size:15px;font-weight:500;
    }
    .wx-parse-warn{font-size:13px;color:var(--color-highlight-deep,#E65100);margin-top:4px}
    .wx-voice-actions{display:flex;gap:12px;justify-content:center}
    .wx-voice-edit-hint{font-size:12px;color:var(--color-text-secondary,#999);margin-top:12px}
    .wx-voice-edit-hint a{color:#07C160;text-decoration:underline;cursor:pointer}

    /* 快捷按钮 */
    .wx-shortcuts{margin-top:8px}
    .wx-shortcut-label{font-size:14px;color:var(--color-text-secondary,#999);margin-bottom:12px}
    .wx-shortcut-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .wx-shortcut-btn{
      background:var(--color-bg-raised,#fff);border:1px solid var(--color-border-subtle,#eee);border-radius:12px;
      padding:16px 12px;font-size:15px;cursor:pointer;text-align:center;
      transition:background 0.2s;display:flex;align-items:center;justify-content:center;gap:6px;
    }
    .wx-shortcut-btn:active{background:var(--color-bg-sunken,#f0f0f0)}
    .wx-sc-icon{font-size:24px}

    /* 表格模式 */
    .wx-table-form{padding:8px 0}
    .wx-table-form h3{font-size:17px;margin-bottom:16px}
    .wx-form-row{margin-bottom:16px}
    .wx-form-row label{display:block;font-size:14px;color:var(--color-text-secondary,#666);margin-bottom:6px}
    .wx-input{
      width:100%;padding:12px;border:1px solid var(--color-border-subtle,#ddd);border-radius:8px;
      font-size:16px;outline:none;background:var(--color-bg-raised,#fff);
    }
    .wx-input:focus{border-color:#07C160}
    .wx-option-row{display:flex;gap:8px;flex-wrap:wrap}
    .wx-option-btn{
      flex:1;min-width:60px;padding:12px 8px;border:2px solid var(--color-border-subtle,#eee);border-radius:8px;
      background:var(--color-bg-raised,#fff);font-size:14px;cursor:pointer;text-align:center;
    }
    .wx-option-btn.selected{border-color:#07C160;background:var(--color-success-soft,#E8F5E9);color:#07C160;font-weight:600}

    /* 拍照识别 */
    .wx-photo-area{width:100%;height:180px;border:2px dashed var(--color-border-subtle,#ddd);border-radius:10px;
      overflow:hidden;display:flex;align-items:center;justify-content:center;
      background:var(--color-bg-sunken,#fafafa);cursor:pointer;position:relative}
    .wx-photo-area.has-photo{border-style:solid;border-color:#07C160}
    .wx-photo-preview{width:100%;height:100%;object-fit:cover}
    .wx-photo-placeholder{text-align:center;color:var(--color-text-muted,#bbb);font-size:15px}
    .wx-photo-placeholder small{display:block;font-size:11px;color:var(--color-text-muted,#ccc);margin-top:4px}
    .wx-photo-actions{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:10px}
    .wx-btn-ai{background:linear-gradient(135deg,#8E44AD,#9B59B6);color:#fff;border:none;
      border-radius:20px;padding:10px 32px;font-size:14px;cursor:pointer}
    .wx-ai-result{margin-top:10px}
    .wx-ai-result-warn{padding:10px 14px;background:#FFF3CD;border-radius:8px;color:#856404;font-size:13px}
    .wx-ai-result-card{
      background:#F3E5F5;border-radius:12px;padding:14px 16px;animation:fadeIn 0.3s
    }
    .wx-ai-badge{font-size:14px;color:#8E44AD;font-weight:600;margin-bottom:6px}
    .wx-ai-text{font-size:14px;color:var(--color-text-primary,#333);line-height:1.5;margin-bottom:8px}
    .wx-ai-tags{display:flex;flex-wrap:wrap;gap:6px}
    .wx-ai-tag{display:inline-block;background:rgba(142,68,173,0.15);border-radius:6px;
      padding:3px 10px;font-size:12px;color:#7B1FA2}
    @keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}

    /* 按钮 */
    .wx-btn{padding:12px 24px;border:none;border-radius:8px;font-size:15px;cursor:pointer;font-weight:500}
    .wx-btn-primary{background:#07C160;color:#fff}
    .wx-btn-primary:active{background:#06AD56}
    .wx-btn-success{background:#1AAD19;color:#fff}
    .wx-btn-secondary{background:var(--color-bg-sunken,#f0f0f0);color:var(--color-text-primary,#333)}
    .wx-btn-sm{padding:6px 12px;font-size:13px;border-radius:6px;background:var(--color-bg-sunken,#f0f0f0);border:none;cursor:pointer}
    .wx-btn-block{width:100%}

    /* 记录列表 */
    .wx-record-list{background:var(--color-bg-raised,#fff);border-radius:12px;overflow:hidden}
    .wx-record-header{
      display:flex;align-items:center;justify-content:space-between;
      padding:12px 16px;border-bottom:1px solid var(--color-border-subtle,#f0f0f0);font-size:14px;color:var(--color-text-secondary,#666);
    }
    .wx-record-item{
      display:flex;justify-content:space-between;align-items:center;
      padding:14px 16px;border-bottom:1px solid var(--color-border-subtle,#f5f5f5);
    }
    .wx-record-item:last-child{border-bottom:none}
    .wx-record-left{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .wx-rec-time{font-size:13px;color:var(--color-text-secondary,#999);min-width:42px}
    .wx-rec-type{font-size:15px;font-weight:500}
    .wx-rec-amount{font-size:14px;color:var(--color-text-secondary,#666)}
    .wx-rec-tag{font-size:12px}
    .wx-rec-recorder{font-size:11px;color:var(--color-text-muted,#bbb);background:var(--color-bg-sunken,#f9f9f9);padding:2px 6px;border-radius:6px}

    /* 我的 */
    .wx-me-page{}
    .wx-me-card{
      background:var(--color-bg-raised,#fff);border-radius:12px;padding:24px;text-align:center;margin-bottom:12px;
    }
    .wx-me-avatar{font-size:48px;margin-bottom:8px}
    .wx-me-name{font-size:18px;font-weight:600;margin-bottom:4px}
    .wx-me-info{font-size:13px;color:var(--color-text-secondary,#999)}
    .wx-me-menu{background:var(--color-bg-raised,#fff);border-radius:12px;overflow:hidden;margin-bottom:12px}
    .wx-me-item{
      display:flex;justify-content:space-between;align-items:center;
      padding:16px;border-bottom:1px solid var(--color-border-subtle,#f5f5f5);font-size:15px;cursor:pointer;
    }
    .wx-me-item:last-child{border-bottom:none}
    .wx-me-item:active{background:var(--color-bg-sunken,#f9f9f9)}

    /* 引导页 */
    .wx-onboard{padding:40px 24px;text-align:center}
    .wx-onboard-logo{font-size:64px;margin-bottom:16px}
    .wx-onboard h2{font-size:22px;margin-bottom:8px}
    .wx-onboard p{color:var(--color-text-secondary,#999);margin-bottom:24px}
    .wx-onboard-form{text-align:left;max-width:320px;margin:0 auto}

    /* 状态 */
    .wx-empty,.wx-error,.wx-loading{text-align:center;padding:60px 20px;color:var(--color-text-secondary,#999);font-size:15px}
    .wx-error{color:var(--color-error,#E74C3C)}
    .wx-disclaimer-small{font-size:11px;color:var(--color-text-muted,#bbb);text-align:center;padding:16px;line-height:1.5}

    /* Toast */
    .wx-toast{
      position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:999;
      background:rgba(0,0,0,0.8);color:#fff;padding:10px 20px;
      border-radius:20px;font-size:14px;opacity:0;transition:opacity 0.3s;pointer-events:none;
      max-width:80%;text-align:center;
    }
    .wx-toast.show{opacity:1;pointer-events:auto}

    /* 加载 */
    .wx-loading-overlay{
      position:fixed;inset:0;background:rgba(255,255,255,0.9);z-index:300;
      display:flex;align-items:center;justify-content:center;
    }
    /* P1（v94）：夜间/暗色下遮罩与页面同色，消除「遮罩亮、页面暗」割裂 */
    [data-theme="dark"] .wx-loading-overlay,
    [data-theme="night"] .wx-loading-overlay{background:rgba(28,26,23,0.92)}
    .wx-spinner{
      width:36px;height:36px;border:3px solid var(--color-border-subtle,#eee);
      border-top-color:#07C160;border-radius:50%;
      animation:spin 0.8s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}

    /* 语音弹窗 */
    .wx-voice-modal{
      position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:200;
      display:flex;align-items:center;justify-content:center;
    }
    .wx-voice-dialog{
      background:var(--color-bg-raised,#fff);border-radius:16px;padding:32px 24px;
      max-width:280px;width:90%;text-align:center;
    }
    .wx-voice-dialog .wx-voice-status{font-size:16px;margin-bottom:16px}
    .wx-voice-wave{display:flex;gap:3px;justify-content:center;height:48px;align-items:center;margin-bottom:16px}
    .wx-voice-wave span{
      width:3px;background:#07C160;border-radius:2px;
      animation:wxWave 0.7s ease-in-out infinite;
    }
    .wx-voice-wave span:nth-child(1){height:16px;animation-delay:0s}
    .wx-voice-wave span:nth-child(2){height:28px;animation-delay:0.1s}
    .wx-voice-wave span:nth-child(3){height:38px;animation-delay:0.2s}
    .wx-voice-wave span:nth-child(4){height:28px;animation-delay:0.3s}
    .wx-voice-wave span:nth-child(5){height:16px;animation-delay:0.4s}
    @keyframes wxWave{0%,100%{height:8px}50%{height:40px}}
    .wx-voice-realtext{font-size:14px;color:var(--color-text-secondary,#666);min-height:20px;margin-bottom:16px}

    .hidden{display:none!important}
  </style>
  <!-- 资源条件注入（§1.2）：必须在内联 <style> 之后加载，tokens.css 才能覆盖
       v1 = 纯内联样式（0 个 v2 请求，所有 var() 走浅色回退值，渲染与 V74 一致）；
       v2 = 追加 tokens + base + styles-v2 + theme-v2。
       P1（v94）：内联样式已 token 化（var(--token, 浅色回退)），
       v2 通道夜间/暗色模式真正作用于 wx-* 组件，meta theme-color 与页面同步。
       #79：base.css 替代 styles-v1.css 作为 V2 布局基础（styles-v2 自包含化） -->
  <script>
  (function(){
    if (window.__UI_V2__) {
      document.write('<link rel="stylesheet" href="css/tokens.css?v=107">');
      document.write('<link rel="stylesheet" href="css/base.css?v=107">');
      document.write('<link rel="stylesheet" href="css/styles-v2.css?v=107">');
      document.write('<script src="js/theme-v2.js?v=107"><\/script>');
    }
  })();
  </script>
</head>
<body>
  <div id="app">
    <div class="wx-loading">
      <div class="wx-spinner"></div>
      <p style="margin-top:12px">加载中...</p>
    </div>
  </div>

  <!-- Toast -->
  <div id="wx-toast" class="wx-toast"></div>

  <!-- 语音弹窗 -->
  <div id="wx-voice-modal" class="wx-voice-modal hidden">
    <div class="wx-voice-dialog">
      <div class="wx-voice-status" id="wx-voice-status">正在聆听...</div>
      <div class="wx-voice-wave">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      <div class="wx-voice-realtext" id="wx-voice-realtext"></div>
      <button class="wx-btn wx-btn-secondary" onclick="Voice.stop()">停止</button>
    </div>
  </div>

  <!-- 加载 -->
  <div id="wx-loading" class="wx-loading-overlay hidden">
    <div class="wx-spinner"></div>
  </div>

  <!-- 共享模块（HTTP 模式，无需 CloudBase SDK；theme-v2.js 已随双通道在 <head> 条件注入） -->
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/voice.js"></script>

  <!-- 微信专属模块 -->
  <script src="js/wechat-auth.js"></script>
  <script src="js/wechat-app.js"></script>

  <script>
    // 覆盖 Toast / Loading（微信端样式）
    Utils.showToast = function(msg, duration) {
      const el = document.getElementById('wx-toast');
      el.textContent = msg; el.classList.add('show');
      clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), duration || 2000);
    };
    Utils.showLoading = function(msg) {
      const overlay = document.getElementById('wx-loading');
      if (overlay) overlay.classList.remove('hidden');
    };
    Utils.hideLoading = function() {
      const overlay = document.getElementById('wx-loading');
      if (overlay) overlay.classList.add('hidden');
    };

    // 启动
    window.addEventListener('DOMContentLoaded', () => {
      WechatApp.init();
    });
  </script>
</body>
</html>
