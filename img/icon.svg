<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4A90D9"/>
      <stop offset="100%" stop-color="#7EC8E3"/>
    </linearGradient>
  </defs>

  <!-- 背景圆角方形 -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- 奶瓶主体 -->
  <g transform="translate(256, 280)">
    <!-- 瓶身 -->
    <rect x="-70" y="-100" width="140" height="160" rx="20" fill="white" opacity="0.95"/>
    <!-- 瓶口 -->
    <rect x="-35" y="-145" width="70" height="55" rx="12" fill="white" opacity="0.95"/>
    <!-- 奶嘴 -->
    <ellipse cx="0" cy="-170" rx="30" ry="32" fill="#FFD93D"/>
    <!-- 奶量刻度线 -->
    <line x1="-50" y1="-20" x2="50" y2="-20" stroke="#4A90D9" stroke-width="3" opacity="0.3"/>
    <line x1="-50" y1="30" x2="50" y2="30" stroke="#4A90D9" stroke-width="3" opacity="0.3"/>
    <line x1="-50" y1="80" x2="50" y2="80" stroke="#4A90D9" stroke-width="3" opacity="0.3"/>
    <!-- 刻度数字 -->
    <text x="60" y="18" font-size="20" fill="#4A90D9" opacity="0.4" font-family="Arial">120</text>
    <text x="60" y="68" font-size="20" fill="#4A90D9" opacity="0.4" font-family="Arial">90</text>
  </g>

  <!-- 爱心装饰 -->
  <g transform="translate(380, 140)">
    <path d="M0,-15 C-5,-25 -25,-25 -25,-10 C-25,5 0,20 0,20 C0,20 25,5 25,-10 C25,-25 5,-25 0,-15Z"
          fill="#FF6B6B" opacity="0.8"/>
  </g>
</svg>
